# Copy this file to config.toml and fill in the blanks.
# config.toml is gitignored because it can hold secrets.

[anthropic]
# The agent's brain. Defaults to the current Opus.
model = "claude-opus-5"

[search]
# "auto"  -> use Prowlarr if configured, otherwise fall back to apibay (TPB)
# "prowlarr" -> Prowlarr only
# "apibay"   -> The Pirate Bay JSON API only (works with no setup)
backend = "auto"

[search.prowlarr]
# Stand up Prowlarr (docker is easiest), then paste its URL + API key here.
# Leave url empty to disable Prowlarr and use the apibay fallback.
url = ""
api_key = ""

[deluge]
# Deluge daemon RPC. Requires `deluged` running (see README).
host = "127.0.0.1"
port = 58846
# Leave username/password empty to auto-read ~/.config/deluge/auth (localclient).
username = ""
password = ""
# Only for a Deluge that is NOT the native run-as-you daemon — a container has
# its own auth file, and the fallback above would read the host's instead. The
# only symptom of getting this wrong is an unexplained "Bad login".
auth_file = ""

# Container path -> host path, for a Deluge running in a container. It reports
# save_path from inside its own namespace (/downloads), which does not exist on
# the host, where the same files are at /mnt/data/downloads. Only the automated
# pipeline needs this; a native deluged already reports host paths and can leave
# it empty.
[deluge.path_map]
# "/downloads" = "/mnt/data/downloads"

[vpn]
# "pia"     -> the tunnel on this machine (the laptop). piactl when PIA is
#              installed and connected, otherwise a route check that covers
#              ProtonVPN (proton0) and any other host tunnel.
# "gluetun" -> the VPN container's control server (the server, and the
#              containerised rehearsal stack). Required there because the
#              tunnel lives in a network namespace, not on the host.
provider = "pia"
# gluetun only. The api_key must match a role in gluetun's
# /gluetun/auth/config.toml — see deploy/casaos/init-gluetun-auth.sh.
# Prefer the GLUETUN_API_KEY env var over storing it here.
control_url = "http://127.0.0.1:8000"
api_key = ""

[preferences]
# Most-preferred resolution first.
resolutions = ["1080p", "2160p", "720p"]
# Release is boosted if its codec matches any of these (substring, case-insensitive).
prefer_codecs = ["x265", "hevc", "h265"]
# Drop single TV episodes larger than this (GB). 0 disables the cap.
max_episode_size_gb = 20
# Drop results with fewer seeders than this.
min_seeders = 1

[server]
# The media server scripts/transfer.py pushes to over rsync/SSH.
user = "casaos"
host = "casaos.local"
ssh_key = "~/.ssh/id_rsa_ha"

[server.destinations]
# transfer.py grows one --flag per entry here.
film = "/mnt/data/film"
tv = "/mnt/data/tv"
book = "/media/local/books"
manga = "/media/local/manga"

[jellyfin]
# Jellyfin on the media server; transfer.py asks it to scan after a transfer.
# API key: Jellyfin Dashboard -> API Keys. Prefer the JELLYFIN_API_KEY env var
# over storing it here.
url = "http://casaos.local:8096"
api_key = ""

[tmdb]
# Optional. scripts/tmdb_id.py tags tidied media with its TMDB id so Jellyfin
# matches it exactly. Without a key it resolves ids through Wikidata instead,
# which is enough for anything that is not brand new. Key: themoviedb.org ->
# Settings -> API. Prefer the TMDB_API_KEY env var over storing it here.
api_key = ""

[jellyfin.path_map]
# Server path -> path inside the Jellyfin container (its bind mounts).
# Paths with no mapping (books, manga) skip the scan.
"/mnt/data/tv" = "/media/tv"
"/mnt/data/film" = "/media/movies"
