# systemd-resolved drop-in: keep .local names resolvable under ProtonVPN.
#
# Install as /etc/systemd/resolved.conf.d/mdns.conf, then:
#   sudo resolvectl mdns <lan-interface> yes
#   sudo systemctl restart systemd-resolved
#
# See deploy/host/README.md for why this is needed — the symptom points
# nowhere near the cause.

[Resolve]
MulticastDNS=yes
