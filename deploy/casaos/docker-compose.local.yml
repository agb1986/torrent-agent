# Laptop rehearsal override. Applied on top of docker-compose.yml:
#
#   docker compose -f deploy/casaos/docker-compose.yml \
#                  -f deploy/casaos/docker-compose.local.yml up -d
#
# It changes only two things — where data lives and which ports are published —
# so anything else that works here works on the server unchanged. Resist adding
# behaviour differences to this file; that is how a rehearsal stops proving
# anything.
#
# Ports are shifted because the existing laptop stack owns the defaults:
#   8112 -> 8113   Deluge web UI
#   58846 -> 58847 Deluge daemon RPC (native deluged keeps 58846)
#   8000 -> 8000   gluetun control server (nothing else wants it)
#
# All three bind 127.0.0.1 explicitly. Docker's default is 0.0.0.0, which put
# the Deluge web UI — carrying the linuxserver image's default password,
# "deluge" — in reach of everything on the wifi. The VPN work protects the
# traffic; it does nothing about who can reach the control surface. Nothing
# off-box needs any of these: the agent, the bot and sync_pf_port all connect
# over loopback. The server's own compose deliberately keeps 0.0.0.0, since a
# headless box with no local browser has to be reachable somehow.

services:
  gluetun:
    ports: !override
      - "127.0.0.1:8113:8112"
      - "127.0.0.1:58847:58846"
      - "127.0.0.1:8000:8000"
    volumes: !override
      - ${HOME}/srv-rehearsal/AppData/gluetun:/gluetun

  deluge:
    volumes: !override
      - ${HOME}/srv-rehearsal/AppData/deluge:/config
      - ${HOME}/srv-rehearsal/downloads:/downloads
